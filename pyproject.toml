[project]
name = "inquiry-dx-django"
version = "0.1.0"
description = "Djangoによる社内問い合わせ管理システム"
readme = "README.md"
authors = [
    { name = "rin-sato-tech", email = "rinsato.dev@gmail.com" }
]
requires-python = ">=3.12.12"
dependencies = [
    "django>=5.2,<5.3",
    "psycopg[binary]>=3.2,<4",
]

[project.scripts]
inquiry-dx-django = "inquiry_dx_django.cli:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
