{% load static %}<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{% block title %}社内問い合わせ{% endblock %}</title><link rel="stylesheet" href="{% static 'inquiry_dx_django/app.css' %}"></head>
<body><header><a class="brand" href="{% url 'inquiries:list' %}">社内問い合わせ</a>{% if user.is_authenticated %}<nav><a href="{% url 'inquiries:list' %}">自分の問い合わせ</a><a href="{% url 'inquiries:create' %}">新規登録</a><a href="{% url 'password_change' %}">パスワード変更</a><span>{{ user }}</span><form method="post" action="{% url 'logout' %}">{% csrf_token %}<button class="subtle">ログアウト</button></form></nav>{% endif %}</header><main>{% block content %}{% endblock %}</main></body></html>
